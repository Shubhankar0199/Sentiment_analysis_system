<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sentiment Gauge</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="wrap">

    <div class="eyebrow">
        A reading instrument
    </div>

    <h1>
        Sentiment <em>Gauge</em>
    </h1>

    <p class="sub">
        Enter a sentence and the needle reads its emotional pressure.
    </p>

    <div class="instrument">

        <div class="gauge-wrap">

            <svg id="gauge" viewBox="0 0 360 220">

                <path d="M 30 172 A 150 150 0 0 1 330 172"
                    fill="none"
                    stroke="#3a362f"
                    stroke-width="14"/>

                <path id="zone-neg"
                    d="M 30 172 A 150 150 0 0 1 96.5 45.5"
                    fill="none"
                    stroke="#b85c4a"
                    stroke-width="4"/>

                <path id="zone-pos"
                    d="M 263.5 45.5 A 150 150 0 0 1 330 172"
                    fill="none"
                    stroke="#6b9b7c"
                    stroke-width="4"/>

                <g id="ticks"></g>

                <text x="48"
                      y="130"
                      class="zone-label"
                      text-anchor="middle">

                      NEGATIVE

                </text>

                <text x="312"
                      y="130"
                      class="zone-label"
                      text-anchor="middle">

                      POSITIVE

                </text>

                <g class="needle-group" id="needle-group">

                    <line x1="180"
                          y1="172"
                          x2="180"
                          y2="60"
                          stroke="#c9a24b"
                          stroke-width="3"/>

                    <polygon
                        points="180,55 175,68 185,68"
                        fill="#c9a24b"/>

                </g>

                <circle
                    cx="180"
                    cy="172"
                    r="9"
                    fill="#1b1917"
                    stroke="#c9a24b"
                    stroke-width="2"/>

            </svg>

            <div class="verdict-block">

                <div
                    id="verdict"
                    class="verdict-word empty">

                    Awaiting input

                </div>

                <div
                    id="score-line"
                    class="verdict-score">

                    Confidence 0%

                </div>

            </div>

        </div>

        <div class="input-row">

            <div class="slot">

                <textarea
                    id="sentence"
                    rows="3"
                    placeholder="Type your sentence here...">

                </textarea>

            </div>

            <button id="analyze">

                Analyze

            </button>

        </div>

        <div class="breakdown" id="breakdown">

            <div class="breakdown-label">

                Prediction

            </div>

            <div id="word-chips"
                 class="word-chips">

            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
